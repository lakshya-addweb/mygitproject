<template>
    <lightning-card title="Lead Report by Industry" icon-name="standard:lead">
        <div class="slds-m-around_medium">
            <lightning-datatable
                key-field="industry"
                data={leadData}
                columns={columns}
                hide-checkbox-column="true"
                class="slds-m-top_medium"
            ></lightning-datatable>
        </div>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading Report"></lightning-spinner>
        </template>
        <template if:true={error}>
            <div class="slds-text-color_error">
                {error}
            </div>
        </template>
    </lightning-card>
</template>
